name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Verificar estructura y configuración
        shell: bash
        run: |
          set -euxo pipefail
          echo "Directorio de trabajo: $(pwd)"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d app/src/main/java
          grep -q 'include(":app")' settings.gradle.kts
          grep -q 'apply false' build.gradle.kts
          if grep -q 'id("com.android.application")' build.gradle.kts && ! grep -q 'apply false' build.gradle.kts; then
            echo 'ERROR: el plugin Android no debe aplicarse en el Gradle raíz.'
            exit 1
          fi
          echo 'Estructura válida: aplicación Android ubicada en :app.'
          find app/src/main -maxdepth 1 -name AndroidManifest.xml -print

      - name: Instalar SDK requerido
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Compilar módulo Android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew :app:tasks --all --no-daemon | grep -E '(^|:)assembleDebug'
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK generado
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DavidLG-IPTV-Player-5.14.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
